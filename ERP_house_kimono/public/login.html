<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../js/head.js"></script>
    <title>Login - Alga ERP</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #E2E8F0;
      }
      .login-card {
        background-color: #1E293B;
        border: 1px solid #334159;
        border-radius: 16px;
        padding: 40px 48px;
        width: 360px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }
      .login-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .login-header .logo {
        font-size: 2rem;
        font-weight: 700;
        color: #3B82F6;
        margin-bottom: 8px;
      }
      .login-header h1 {
        font-size: 1.3rem;
        color: #F1F5F9;
        font-weight: 600;
      }
      .login-header p {
        color: #64748B;
        font-size: 0.8rem;
        margin-top: 6px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        font-size: 0.8rem;
        color: #94A3B8;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .form-group input {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.9rem;
        border: 1px solid #334159;
        border-radius: 8px;
        background-color: #0F172A;
        color: #F1F5F9;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-group input:focus {
        border-color: #3B82F6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }
      .btn-entrar {
        width: 100%;
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 600;
        color: #FFFFFF;
        background-color: #2563EB;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.15s, opacity 0.15s;
      }
      .btn-entrar:hover {
        background-color: #1D4ED8;
      }
      .btn-entrar:disabled {
        background-color: #334159;
        cursor: not-allowed;
      }
      .mensagem {
        margin-top: 14px;
        padding: 10px 16px;
        border-radius: 8px;
        text-align: center;
        font-size: 0.85rem;
        font-weight: 500;
      }
      .mensagem.erro {
        background-color: #450A0A;
        color: #FCA5A5;
        border: 1px solid #EF4444;
      }
      .mensagem.sucesso {
        background-color: #064E35;
        color: #6EE7B7;
        border: 1px solid #10B981;
      }
      .config-senha {
        text-align: center;
        margin-top: 18px;
        font-size: 0.8rem;
      }
      .config-senha a {
        color: #3B82F6;
        text-decoration: none;
        cursor: pointer;
      }
      .config-senha a:hover {
        text-decoration: underline;
      }
      html.dark-theme body {
        background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%);
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-header">
        <div class="logo">Alga ERP</div>
        <h1>Login do Sistema</h1>
        <p>Digite a senha para continuar</p>
      </div>

      <form id="formLogin" autocomplete="off">
        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite a senha de acesso"
            required
            autofocus
          />
        </div>

        <button type="submit" class="btn-entrar" id="btnEntrar">
          Entrar
        </button>

        <div id="mensagem" class="mensagem" style="display: none;"></div>
      </form>

      <div class="config-senha">
        <a id="btnAlterarSenha" onclick="abrirAlterarSenha()" style="margin-right:12px;">&#9881; Alterar senha</a>
        <a id="btnSenhaVendedor" onclick="abrirVendedorSenha()">&#128274; Senha do vendedor</a>
      </div>
    </div>

    <div id="modalVendedor" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 10000;">
      <div style="background: #1E293B; border: 1px solid #334159; border-radius: 12px; padding: 28px 32px; width: 380px; color: #E2E8F0;">
        <h3 style="color: #F1F5F9; font-size: 1.1rem; margin-bottom: 16px; text-align: center;">Senha do Vendedor (acesso restrito)</h3>
        <div class="form-group" style="margin-bottom: 14px;">
          <label for="senhaVendedor" style="color: #94A3B8;">Nova senha do vendedor</label>
          <input type="password" id="senhaVendedor" style="width: 100%; padding: 10px 14px; font-size: 0.9rem; border: 1px solid #334159; border-radius: 8px; background-color: #0F172A; color: #F1F5F9; outline: none;" placeholder="mínimo 4 caracteres" />
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="button" id="btnConfirmarVendedor" class="btn-entrar" style="flex: 1; background-color: #16A34A;">Salvar</button>
          <button type="button" id="btnCancelarVendedor" class="btn-entrar" style="flex: 1; background-color: #64748B;">Cancelar</button>
        </div>
        <div id="msgVendedor" class="mensagem" style="margin-top:12px;"></div>
      </div>
    </div>

    <div id="modalSenha" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 10000;">
      <div style="background: #1E293B; border: 1px solid #334159; border-radius: 12px; padding: 28px 32px; width: 380px; color: #E2E8F0;">
        <h3 style="color: #F1F5F9; font-size: 1.1rem; margin-bottom: 16px; text-align: center;">Alterar Senha</h3>
        <div class="form-group" style="margin-bottom: 14px;">
          <label for="senhaAtual" style="color: #94A3B8;">Senha Atual</label>
          <input type="password" id="senhaAtual" style="width: 100%; padding: 10px 14px; font-size: 0.9rem; border: 1px solid #334159; border-radius: 8px; background-color: #0F172A; color: #F1F5F9; outline: none;" />
        </div>
        <div class="form-group" style="margin-bottom: 14px;">
          <label for="senhaNova" style="color: #94A3B8;">Nova Senha</label>
          <input type="password" id="senhaNova" style="width: 100%; padding: 10px 14px; font-size: 0.9rem; border: 1px solid #334159; border-radius: 8px; background-color: #0F172A; color: #F1F5F9; outline: none;" />
        </div>
        <div class="form-group" style="margin-bottom: 18px;">
          <label for="senhaConfirmar" style="color: #94A3B8;">Confirmar Nova Senha</label>
          <input type="password" id="senhaConfirmar" style="width: 100%; padding: 10px 14px; font-size: 0.9rem; border: 1px solid #334159; border-radius: 8px; background-color: #0F172A; color: #F1F5F9; outline: none;" />
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="button" id="btnConfirmarSenha" class="btn-entrar" style="flex: 1; background-color: #16A34A;">Confirmar</button>
          <button type="button" id="btnCancelarSenha" class="btn-entrar" style="flex: 1; background-color: #64748B;">Cancelar</button>
        </div>
      </div>
    </div>

    <script src="../js/login.js"></script>
  </body>
</html>
