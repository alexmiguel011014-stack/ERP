<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JiuJitsu ERP - Cadastro de Clientes</title>
    <link rel="stylesheet" href="clientes.css" />
  </head>
  <body>
    <div class="container">
      <h1>Cadastro de Clientes</h1>

      <form id="formCliente">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required />
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" placeholder="Ex: (11) 99999-8888" />
        </div>

        <div class="form-group">
          <label for="academia">Academia</label>
          <input type="text" id="academia" name="academia" placeholder="Ex: Casa do Jiu-Jitsu" />
        </div>

        <div class="form-group">
          <label for="faixa">Faixa</label>
          <select id="faixa" name="faixa">
            <option value="">Selecione</option>
            <option value="Branca">Branca</option>
            <option value="Azul">Azul</option>
            <option value="Roxa">Roxa</option>
            <option value="Marrom">Marrom</option>
            <option value="Preta">Preta</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Salvar Cliente</button>
          <button type="reset" class="btn btn-secondary" id="btnLimpar">Limpar</button>
        </div>
      </form>

      <hr />

      <h2>Clientes Cadastrados</h2>
      <div id="listaClientes" class="lista"></div>

      <div id="mensagem" class="mensagem"></div>
    </div>

    <script src="../js/clientes.js"></script>
  </body>
</html>
