<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../js/head.js"></script>
    <script src="../js/auth.js"></script>
    <title>Alga ERP - Clientes</title>
    <link rel="stylesheet" href="clientes.css" />
  </head>
  <body>
    <div class="container">
      <h1>Clientes</h1>
      <p class="subtitle">Cadastro e gerenciamento de clientes</p>

      <form id="formCliente">
        <input type="hidden" id="clienteEditandoId" value="" />

        <!-- Seção Dados Pessoais / Empresariais -->
        <fieldset class="form-section">
          <legend>Dados Pessoais / Empresariais</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="codigoCliente">Código</label>
              <input type="text" id="codigoCliente" readonly placeholder="#CLI0001" />
            </div>
            <div class="form-group form-group-wide">
              <label for="nome">Nome Completo *</label>
              <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required />
            </div>
            <div class="form-group">
              <label for="cpf_cnpj">CPF / CNPJ</label>
              <input type="text" id="cpf_cnpj" name="cpf_cnpj" placeholder="000.000.000-00" />
            </div>
            <div class="form-group form-group-wide">
              <label for="endereco">Endereço</label>
              <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade" />
            </div>
          </div>
        </fieldset>

        <!-- Seção Contato & Perfil Atlético -->
        <fieldset class="form-section">
          <legend>Contato &amp; Perfil Atlético</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="telefone">Telefone / WhatsApp</label>
              <input type="text" id="telefone" name="telefone" placeholder="(11) 99999-8888" maxlength="15" />
            </div>
            <div class="form-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="exemplo@email.com" />
            </div>
            <div class="form-group">
              <label for="academia">Academia</label>
              <input type="text" id="academia" name="academia" placeholder="Ex: Casa do Jiu-Jitsu" />
            </div>
            <div class="form-group">
              <label for="faixa">Faixa</label>
              <select id="faixa" name="faixa">
                <option value="">Selecione</option>
                <option value="Branca">Branca</option>
                <option value="Cinza">Cinza</option>
                <option value="Amarela">Amarela</option>
                <option value="Laranja">Laranja</option>
                <option value="Verde">Verde</option>
                <option value="Azul">Azul</option>
                <option value="Roxa">Roxa</option>
                <option value="Marrom">Marrom</option>
                <option value="Preta">Preta</option>
              </select>
            </div>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Salvar Cliente</button>
          <button type="reset" class="btn btn-secondary" id="btnLimpar">Limpar</button>
          <button type="button" class="btn btn-secondary" id="btnCancelarEdicao" style="display:none;">Cancelar</button>
        </div>
      </form>

      <div id="mensagem" class="mensagem"></div>

      <!-- Tabela de Clientes -->
      <div class="table-section">
        <div class="table-top-bar">
          <input type="text" id="buscaCliente" class="busca-input" placeholder="Buscar por nome, telefone ou academia..." />
          <span class="total-badge" id="totalClientes">0 cliente(s)</span>
        </div>

        <div class="table-responsive">
          <table id="tabelaClientes">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Academia / Faixa</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpoClientes"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="../js/navbar.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/clientes.js"></script>
  </body>
</html>
