<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Jiu-Jitsu - Cadastro de Produto</title>
    <link rel="stylesheet" href="cadastro.css" />
  </head>
  <body>
    <div class="container">
      <h1>Cadastro de Produto</h1>

      <form id="formProduto">
        <div class="form-group">
          <label for="nome">Nome do Produto</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Quimono Trançado" required />
        </div>

        <div class="form-group">
          <label for="categoria">Categoria</label>
          <input type="text" id="categoria" name="categoria" placeholder="Ex: Kimono" />
        </div>

        <hr />

        <div class="grade-header">
          <h2>Grade de Variações</h2>
          <button type="button" id="btnAddLinha" class="btn btn-small">+ Adicionar Linha</button>
        </div>

        <table id="tabelaVariacoes">
          <thead>
            <tr>
              <th>Tamanho</th>
              <th>Cor</th>
              <th>Preço (R$)</th>
              <th>Estoque</th>
              <th>SKU</th>
              <th colspan="2"></th>
            </tr>
          </thead>
          <tbody id="linhasVariacoes"></tbody>
        </table>

        <div id="avisoGrade" class="aviso">Adicione pelo menos uma variação.</div>

        <hr />

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Salvar Produto</button>
          <button type="reset" class="btn btn-secondary" id="btnLimpar">Limpar</button>
        </div>

        <div id="mensagem" class="mensagem"></div>
      </form>
    </div>

    <script src="../js/navbar.js"></script>
    <script src="../js/cadastro.js"></script>
  </body>
</html>
