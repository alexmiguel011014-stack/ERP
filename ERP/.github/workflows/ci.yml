name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# windows-latest, não ubuntu: @journeyapps/sqlcipher é um módulo nativo e o
# app só é distribuído pra Windows (NSIS) — evita todo o problema de
# compilar/rebuildar o binário nativo pra uma plataforma que o projeto nem
# suporta.
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # Lança o Electron de verdade (via Playwright _electron, ver e2e/README.md)
  # — por isso precisa do frontend/out buildado primeiro, e não roda no
  # mesmo job que só faz lint+typecheck acima.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
