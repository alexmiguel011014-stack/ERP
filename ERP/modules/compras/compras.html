<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../core/head.js"></script>
    <script src="../core/auth.js"></script>
    <link rel="stylesheet" href="../core/modulos.css" />
    <title>ALLU ERP - Compras</title>
  </head>
  <body data-requer-modulo="compras">
    <div class="container">
      <h1>Pedidos de Compra</h1>
      <p class="subtitle">Solicite produtos ao fornecedor. No recebimento, o estoque e a conta a pagar são gerados automaticamente.</p>

      <div class="panel">
        <h2>Novo pedido</h2>
        <div class="form-grid">
          <div class="form-group" style="grid-column: span 2;">
            <label for="fornecedorSelect">Fornecedor</label>
            <select id="fornecedorSelect">
              <option value="">Sem fornecedor</option>
            </select>
          </div>
          <div class="form-group" style="grid-column: span 2;">
            <label for="skuInput">SKU</label>
            <input type="text" id="skuInput" placeholder="Escaneie ou digite o SKU e pressione Enter" />
          </div>
          <div class="form-group">
            <label for="qtdInput">Quantidade</label>
            <input type="number" id="qtdInput" min="1" step="1" value="1" />
          </div>
          <div class="form-group">
            <label for="custoInput">Custo unitário (R$)</label>
            <input type="number" id="custoInput" min="0" step="0.01" value="0" />
          </div>
        </div>
        <div id="produtoPreview" style="font-size: 0.85rem; color: #475569; margin-bottom: 10px;"></div>
        <div id="cotacaoPreview" style="font-size: 0.8rem; color: #475569; margin-bottom: 10px;"></div>
        <div class="form-actions">
          <button type="button" id="btnAdicionar" class="btn btn-primary">Adicionar item</button>
        </div>

        <div id="listaItens" style="margin-top: 14px;">
          <div class="empty-state">Nenhum item no pedido.</div>
        </div>

        <div class="form-grid" style="margin-top: 12px;">
          <div class="form-group" style="grid-column: span 2;">
            <label for="obsInput">Observação</label>
            <input type="text" id="obsInput" placeholder="opcional" />
          </div>
          <div class="form-group">
            <label>Total do pedido</label>
            <input type="text" id="totalPedido" readonly value="R$ 0,00" />
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="btnCriar" class="btn btn-success" disabled>Criar Pedido</button>
          <button type="button" id="btnLimpar" class="btn btn-secondary">Limpar</button>
        </div>
      </div>

      <div id="mensagem" class="mensagem"></div>

      <div class="panel">
        <h2>Pedidos</h2>
        <div id="listaPedidos">
          <div class="empty-state">Carregando...</div>
        </div>
      </div>
    </div>

    <div id="printOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 10001;">
      <div style="background: #FFFFFF; border-radius: 8px; padding: 24px; max-width: 640px; width: 92%; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
        <div id="printContent"></div>
        <div style="display: flex; gap: 10px; margin-top: 16px;">
          <button onclick="window.print()" style="flex: 1; padding: 8px; background: #2563EB; color: #fff; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer;">Imprimir / Salvar PDF</button>
          <button onclick="document.getElementById('printOverlay').style.display='none'" style="flex: 1; padding: 8px; background: #64748B; color: #fff; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer;">Fechar</button>
        </div>
      </div>
    </div>

    <style>
      @media print {
        body * { visibility: hidden; }
        #printContent, #printContent * { visibility: visible; }
        #printContent { position: absolute; left: 0; top: 0; width: 100%; }
        #printOverlay { background: transparent; position: static; display: block; padding: 0; }
      }
    </style>

    <script src="../core/banco.js"></script>
    <script src="../core/navbar.js"></script>
    <script src="../core/formatos.js"></script>
    <script src="../core/loading.js"></script>
    <script src="./compras.js"></script>
  </body>
</html>
