<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../core/head.js"></script>
    <script src="../core/auth.js"></script>
    <link rel="stylesheet" href="./vendas.css" />
    <link rel="stylesheet" href="../core/modulos.css" />
    <title>ALLU ERP - Histórico de Vendas</title>
  </head>
  <body>
    <div class="container container-larga">
      <h1>Histórico de Vendas</h1>

      <div class="vendas-painel">
        <div class="vendas-topo">
          <div id="statsVendas" class="stats-bar"></div>
          <div class="vendas-topo-acoes">
            <button id="btnExportCsv" class="btn btn-small">Exportar CSV</button>
            <input type="text" id="buscaVendas" class="busca-vendas" placeholder="Buscar por # venda, cliente..." autocomplete="off" />
          </div>
        </div>

        <div class="vendas-filtros">
          <div class="filtro-data-inline">
            <label for="filterDataInicio">De</label>
            <input type="date" id="filterDataInicio" />
            <label for="filterDataFim">Até</label>
            <input type="date" id="filterDataFim" />
            <button type="button" id="btnFilter" class="btn btn-small">Filtrar por data</button>
          </div>
          <div class="legend-grupo" id="legendStatus">
            <span class="legend-label">Status</span>
            <button type="button" class="legend-btn active" data-status="">Todas <span class="count-badge" id="cntStatusTodas">0</span></button>
            <button type="button" class="legend-btn" data-status="finalizada">Finalizadas <span class="count-badge" id="cntStatusFinalizada">0</span></button>
            <button type="button" class="legend-btn" data-status="orcamento">Orçamentos <span class="count-badge" id="cntStatusOrcamento">0</span></button>
          </div>
          <div class="legend-grupo" id="legendPagamento">
            <span class="legend-label">Pagamento</span>
            <button type="button" class="legend-btn active" data-pagamento="">Todas <span class="count-badge" id="cntPagTodas">0</span></button>
          </div>
          <button type="button" id="btnClear" class="btn-limpar-filtros">Limpar filtros</button>
        </div>

        <div class="tabela-scroll">
          <table class="tabela-vendas">
            <thead>
              <tr>
                <th class="col-expandir"></th>
                <th class="sortable" data-key="id">Venda # <span class="sort-icon" id="sortIcon-id"></span></th>
                <th class="sortable" data-key="cliente_nome">Cliente <span class="sort-icon" id="sortIcon-cliente_nome"></span></th>
                <th class="sortable" data-key="status">Status <span class="sort-icon" id="sortIcon-status"></span></th>
                <th class="sortable" data-key="data_venda">Data <span class="sort-icon" id="sortIcon-data_venda"></span></th>
                <th class="sortable" data-key="forma_pagamento">Pagamento <span class="sort-icon" id="sortIcon-forma_pagamento"></span></th>
                <th class="sortable col-valor" data-key="total">Total <span class="sort-icon" id="sortIcon-total"></span></th>
              </tr>
            </thead>
            <tbody id="tbodyVendas"></tbody>
          </table>
        </div>

        <div class="vendas-paginacao">
          <div class="paginacao-tamanho">
            <label for="linhasPorPagina">Linhas por página:</label>
            <select id="linhasPorPagina">
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div id="pager" class="pager"></div>
        </div>
      </div>

      <div id="mensagem" class="mensagem"></div>
    </div>

    <div id="modalDetalhes" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 10000;">
      <div id="modalDetalhesContent" style="background: #FFFFFF; border-radius: 12px; padding: 24px; max-width: 600px; max-height: 80vh; overflow-y: auto;"></div>
    </div>

    <style>
      @media print {
        body * { visibility: hidden; }
        #modalDetalhesContent, #modalDetalhesContent * { visibility: visible; }
        #modalDetalhesContent { position: absolute; left: 0; top: 0; width: 100%; max-height: none; overflow: visible; }
        #modalDetalhes { background: transparent !important; position: static !important; display: block !important; padding: 0; }
        .no-print { display: none !important; }
      }
    </style>

    <script src="../core/banco.js"></script>
    <script src="../core/navbar.js"></script>
    <script src="../core/formatos.js"></script>
    <script src="../core/vendor/jspdf.umd.min.js"></script>
    <script src="./vendas.js"></script>
  </body>
</html>
