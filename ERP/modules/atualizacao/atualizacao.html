<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../core/head.js"></script>
    <script src="../core/auth.js"></script>
    <title>Atualizações - ALLU ERP</title>
    <link rel="stylesheet" href="../core/modulos.css" />
    <style>
      .header-verde { color: #369929; font-weight: 600; }
      .header-vermelho { color: #DC2626; font-weight: 600; }
      .progress-bar { width: 100%; height: 10px; background: #E2E8F0; border-radius: 6px; overflow: hidden; margin-top: 14px; }
      .progress-fill { height: 100%; background: #2563EB; width: 0%; transition: width 0.3s; }
      .center { text-align: center; }
      .msg { padding: 10px 16px; border-radius: 8px; font-size: 0.85rem; margin-top: 12px; }
      .msg-success { background: #EAF6E8; color: #369929; border: 1px solid #C3E5BF; }
      .msg-info { background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE; }
      .msg-warning { background: #FFFBEB; color: #D97706; border: 1px solid #FDE68A; }
      .msg-error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Atualizações</h1>
      <p class="subtitle">
        Versão atual: <strong id="currentVersion">--</strong> &nbsp;|&nbsp;
        <span id="updateStatus">Verificando...</span>
      </p>

      <div class="panel">
        <h2>Status</h2>
        <p class="subtitle" id="statusDesc">Buscamos uma nova versão em segundo plano.</p>
        <div class="progress-bar" id="progressBar" style="display:none;">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="subtitle" id="progressText" style="display:none; margin-top:6px;">0%</p>
      </div>

      <div id="messageArea"></div>

      <div class="center" style="margin-top:8px;">
        <button class="btn btn-primary" id="btnAtualizar">Atualizar</button>
      </div>
    </div>

    <script src="../core/banco.js"></script>
    <script src="../core/navbar.js"></script>
    <script src="./atualizacao.js"></script>
  </body>
</html>
