<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../core/head.js"></script>
    <title>Login - Alga ERP</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #E2E8F0;
      }
      .login-card {
        background-color: #1E293B;
        border: 1px solid #334159;
        border-radius: 16px;
        padding: 40px 48px;
        width: 360px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }
      .login-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .login-header .logo {
        font-size: 2rem;
        font-weight: 700;
        color: #3B82F6;
        margin-bottom: 8px;
      }
      .login-header h1 {
        font-size: 1.3rem;
        color: #F1F5F9;
        font-weight: 600;
      }
      .login-header p {
        color: #64748B;
        font-size: 0.8rem;
        margin-top: 6px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        font-size: 0.8rem;
        color: #94A3B8;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .form-group input {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.9rem;
        border: 1px solid #334159;
        border-radius: 8px;
        background-color: #0F172A;
        color: #F1F5F9;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-group input:focus {
        border-color: #3B82F6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }
      .btn-entrar {
        width: 100%;
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 600;
        color: #FFFFFF;
        background-color: #2563EB;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.15s, opacity 0.15s;
      }
      .btn-entrar:hover {
        background-color: #1D4ED8;
      }
      .btn-entrar:disabled {
        background-color: #334159;
        cursor: not-allowed;
      }
      .mensagem {
        margin-top: 14px;
        padding: 10px 16px;
        border-radius: 8px;
        text-align: center;
        font-size: 0.85rem;
        font-weight: 500;
      }
      .mensagem.erro {
        background-color: #450A0A;
        color: #FCA5A5;
        border: 1px solid #EF4444;
      }
      .mensagem.sucesso {
        background-color: #064E35;
        color: #6EE7B7;
        border: 1px solid #10B981;
      }
      html.dark-theme body {
        background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%);
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-header">
        <div class="logo">Alga ERP</div>
        <h1>Login do Sistema</h1>
        <p>Digite seu usuário e senha para continuar</p>
      </div>

      <form id="formLogin" autocomplete="off">
        <div class="form-group">
          <label for="usuario">Usuário</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Seu login de acesso"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite a senha de acesso"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn-entrar" id="btnEntrar">
          Entrar
        </button>

        <div id="mensagem" class="mensagem" style="display: none;"></div>
      </form>
    </div>

    <script src="./login.js"></script>
  </body>
</html>
