<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../core/head.js"></script>
    <title>Login - ALLU ERP</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --cor-primaria: #00006b; --cor-primaria-forte: #00004d; --cor-primaria-fraca: #E6E6F0; --cor-primaria-fraca-borda: #B8B8D4;
        --cor-sucesso: #0c8006; --cor-sucesso-fraca: #E6F2E6; --cor-sucesso-borda: #B8DCB5;
        --cor-destaque: #00006b; --cor-destaque-ink: #00004d; --cor-destaque-fraca: #E6E6F0; --cor-destaque-borda: #B8B8D4; --cor-destaque-solido: #00006b;
        --cor-erro: #e02815; --cor-erro-fraca: #FDECEC; --cor-erro-borda: #F5C2BD;
        --raio: 10px; --raio-sm: 7px;
        --sombra-card: 0 1px 2px rgba(0,0,0,0.05), 0 8px 24px -12px rgba(0,0,0,0.1);
      }
      html.dark-theme {
        --cor-primaria: #4F4FFF; --cor-primaria-forte: #6B6BFF; --cor-primaria-fraca: #14144A; --cor-primaria-fraca-borda: #2D2D7A;
        --cor-sucesso: #25B31C; --cor-sucesso-fraca: #0F2E0D; --cor-sucesso-borda: #1E4A1C;
        --cor-destaque: #4F4FFF; --cor-destaque-ink: #E6E6F0; --cor-destaque-fraca: #14144A; --cor-destaque-borda: #2D2D7A; --cor-destaque-solido: #4F4FFF;
        --cor-erro: #FF4D3D; --cor-erro-fraca: #3A1A18; --cor-erro-borda: #7A2E2A;
        --sombra-card: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
      }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(circle at 50% 0%, rgba(0, 0, 107, 0.08) 0%, rgba(0, 0, 107, 0) 60%),
          #F1F5F9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1E293B;
      }
      .login-card {
        background-color: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: var(--raio-sm);
        padding: 40px 48px;
        width: 360px;
        box-shadow: var(--sombra-card);
      }
      .login-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .login-header .logo {
        font-size: 2rem;
        font-weight: 700;
        color: var(--cor-primaria);
        margin-bottom: 8px;
      }
      .login-header h1 {
        font-size: 1.3rem;
        color: #0F172A;
        font-weight: 600;
      }
      .login-header p {
        color: #94A3B8;
        font-size: 0.8rem;
        margin-top: 6px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        font-size: 0.8rem;
        color: #64748B;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .form-group input {
        width: 100%;
        padding: 10px 14px;
        font-size: 0.9rem;
        border: 1px solid #E2E8F0;
        border-radius: var(--raio-sm);
        background-color: #FFFFFF;
        color: #1E293B;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-group input:focus {
        border-color: var(--cor-primaria);
        box-shadow: 0 0 0 2px var(--cor-primaria-fraca-borda);
      }
      .btn-entrar {
        width: 100%;
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 600;
        color: #FFFFFF;
        background-color: var(--cor-primaria);
        border: none;
        border-radius: var(--raio-sm);
        box-shadow: none;
        cursor: pointer;
        transition: background-color 0.15s, opacity 0.15s;
      }
      .btn-entrar:hover {
        background-color: var(--cor-primaria-forte);
      }
      .btn-entrar:disabled {
        background-color: #CBD5E1;
        cursor: not-allowed;
      }
      .mensagem {
        margin-top: 14px;
        padding: 10px 16px;
        border-radius: var(--raio-sm);
        text-align: center;
        font-size: 0.85rem;
        font-weight: 500;
      }
      .mensagem.erro {
        background-color: var(--cor-erro-fraca);
        color: var(--cor-erro);
        border: 1px solid var(--cor-erro-borda);
      }
      .mensagem.sucesso {
        background-color: var(--cor-sucesso-fraca);
        color: var(--cor-sucesso);
        border: 1px solid var(--cor-sucesso-borda);
      }
      html.dark-theme body {
        background:
          radial-gradient(circle at 50% 0%, rgba(79, 79, 255, 0.14) 0%, rgba(79, 79, 255, 0) 60%),
          #0F172A;
        color: #E2E8F0;
      }
      html.dark-theme .login-card {
        background-color: #1E293B;
        border-color: #334159;
        box-shadow: var(--sombra-card);
      }
      html.dark-theme .login-header h1 { color: #F1F5F9; }
      html.dark-theme .login-header p { color: #64748B; }
      html.dark-theme .form-group label { color: #94A3B8; }
      html.dark-theme .form-group input {
        background-color: #0F172A;
        border-color: #334159;
        color: #F1F5F9;
      }
      html.dark-theme .btn-entrar:disabled { background-color: #334159; }
      html.dark-theme .mensagem.erro {
        background-color: var(--cor-erro-fraca);
        color: var(--cor-erro);
        border-color: var(--cor-erro-borda);
      }
      html.dark-theme .mensagem.sucesso {
        background-color: var(--cor-sucesso-fraca);
        color: var(--cor-sucesso);
        border-color: var(--cor-sucesso-borda);
      }

      /* ---- Splash pós-login ----
         Toca por 3s depois de autenticar com sucesso, antes de ir pro
         Dashboard. Triângulo de Penrose com anel interno girando contínuo
         e glow pulsante; abaixo, a marca ALLU ERP estática (mesmo lockup
         da sidebar). Fica oculto até login.js ativar. */
      #loginSplash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000033;
        overflow: hidden;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      #loginSplash.ativo { display: flex; }
      #loginSplash.saindo { opacity: 0; transition: opacity 0.2s linear; }
      #loginSplash .splash-penrose {
        width: min(46vw, 260px);
        height: auto;
        opacity: 0;
        animation: loginSplashFade 500ms ease-out forwards;
      }
      #loginSplash .splash-penrose .circle-spinner {
        transform-box: fill-box;
        transform-origin: center;
        animation: loginSplashSpin 1.5s linear infinite;
      }
      #loginSplash .splash-penrose .penrose-bg {
        animation: loginSplashPulso 3s ease-in-out infinite;
      }
      #loginSplash .splash-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        opacity: 0;
        animation: loginSplashFade 500ms ease-out 150ms forwards;
      }
      #loginSplash .splash-brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, #00006b, #00004d);
        color: #FFFFFF;
        font-weight: 800;
        font-size: 1.05rem;
      }
      #loginSplash .splash-brand-text {
        color: #F8FAFC;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      @keyframes loginSplashFade {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes loginSplashSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes loginSplashPulso {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loginSplash .splash-penrose .circle-spinner,
        #loginSplash .splash-penrose .penrose-bg {
          animation: none;
        }
      }
    </style>
  </head>

        <span class="splash-brand-mark">AE</span>
        <span class="splash-brand-text">ALLU ERP</span>
      </div>
    </div>
    <div class="login-card">
      <div class="login-header">
        <div class="logo">ALLU ERP</div>
        <h1>Login do Sistema</h1>
        <p>Digite seu usuário e senha para continuar</p>
      </div>

      <form id="formLogin" autocomplete="off">
        <div class="form-group">
          <label for="usuario">Usuário</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Seu login de acesso"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite a senha de acesso"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn-entrar" id="btnEntrar">
          Entrar
        </button>

        <div id="mensagem" class="mensagem" style="display: none;"></div>
      </form>
    </div>

    <script src="./login.js"></script>
