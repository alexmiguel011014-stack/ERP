<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../core/head.js"></script>
    <script src="../core/auth.js"></script>
    <title>Alga ERP - Cadastro de Clientes</title>
    <link rel="stylesheet" href="clientes.css" />
  </head>
  <body>
    <div class="container">
      <h1>Clientes</h1>
      <p class="subtitle">Cadastro e edição de clientes</p>

      <form id="formCliente">
        <input type="hidden" id="clienteEditandoId" value="" />

        <!-- Dados Principais -->
        <fieldset class="form-section">
          <legend>Dados Principais</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="codigoCliente">Código</label>
              <input type="text" id="codigoCliente" name="codigo" placeholder="C0001..." />
            </div>
            <div class="form-group form-group-wide">
              <label for="nome">Nome Completo *</label>
              <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva ou Loja XYZ" required />
            </div>
            <div class="form-group">
              <label for="cpf_cnpj">CPF / CNPJ</label>
              <input type="text" id="cpf_cnpj" name="cpf_cnpj" placeholder="000.000.000-00" />
            </div>
            <div class="form-group form-group-wide">
              <label for="endereco">Endereço</label>
              <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade" />
            </div>
          </div>
        </fieldset>

        <!-- Contato -->
        <fieldset class="form-section">
          <legend>Contato</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="telefone">Telefone / WhatsApp</label>
              <input type="text" id="telefone" name="telefone" placeholder="(11) 99999-8888" maxlength="15" />
            </div>
            <div class="form-group form-group-wide">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="exemplo@email.com" />
            </div>
          </div>
        </fieldset>

        <!-- Movimentações (visível apenas ao editar) -->
        <fieldset class="form-section" id="movimentacoesSection" style="display:none;">
          <legend>Movimentações <button type="button" id="btnVerMovimentacoes" class="btn btn-small btn-secondary">Ver movimentações</button></legend>
          <div id="movimentacoesContainer"></div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar Cliente</button>
          <button type="reset" class="btn btn-secondary" id="btnLimpar">Limpar</button>
          <button type="button" class="btn btn-secondary" id="btnCancelarEdicao" style="display:none;">Cancelar</button>
          <a href="./lista-clientes.html" class="btn btn-secondary">Lista de Clientes</a>
        </div>
      </form>

      <div id="mensagem" class="mensagem"></div>
    </div>

    <div id="movimentacoesModal" class="modal-backdrop" style="display:none;">
      <div class="modal">
        <div class="modal-header">
          <h3>Movimentações do cliente <strong id="modalClienteNome"></strong></h3>
          <button type="button" id="modalClose" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div id="modalMovimentacoes"></div>
        </div>
      </div>
    </div>

    <script src="../core/banco.js"></script>
    <script src="../core/navbar.js"></script>
    <script src="./clientes.js"></script>
  </body>
</html>
