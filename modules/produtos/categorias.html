<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../core/head.js"></script>
    <script src="../core/auth.js"></script>
    <title>ALLU ERP - Lista de Categorias</title>
    <link rel="stylesheet" href="../core/modulos.css" />
    <link rel="stylesheet" href="categorias.css" />
  </head>
  <body data-requer-modulo="produtos">
    <div class="container">
      <h1>Lista de Categorias</h1>
      <p class="subtitle">Gerencie grupos e atributos (tamanhos, cores, etc.)</p>

      <div class="section-block">
        <h2>Nova Categoria / Atributo</h2>

        <form id="formCategoria">
          <div class="form-group" id="grupoNome">
            <label for="nomeCategoria">Nome</label>
            <input type="text" id="nomeCategoria" name="nome" placeholder="Ex: Tamanhos, Cores, A1, Azul..." required />
          </div>

          <div class="form-group">
            <label for="categoriaPai">Agrupar em</label>
            <select id="categoriaPai" name="categoria_pai">
              <option value="">Categoria principal (cria novo grupo)</option>
            </select>
            <div class="aviso" id="avisoSub">
              Selecione um grupo para adicionar atributos a ele (máx. 2 níveis).
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
            <button type="reset" class="btn btn-secondary" id="btnLimpar">Limpar</button>
          </div>
        </form>
      </div>

      <div class="section-block">
        <div class="grade-header">
          <h2>Categorias Cadastradas</h2>
          <input type="text" id="buscaCategoria" class="busca-categoria" placeholder="Buscar por nome..." />
        </div>

        <div class="table-responsive">
          <table id="tabelaCategorias">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Uso (produtos)</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpoCategorias"></tbody>
          </table>
        </div>

        <div id="avisoCategorias" class="aviso"></div>
        <div id="mensagem" class="mensagem"></div>
      </div>
    </div>

    <script src="../core/banco.js"></script>
    <script src="../core/navbar.js"></script>
    <script src="../core/store.js"></script>
    <script src="../core/loading.js"></script>
    <script src="./categorias.js"></script>
  </body>
</html>
