<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../core/head.js"></script>
    <script src="../core/auth.js"></script>
    <title>ALLU ERP - Lista de Clientes</title>
    <link rel="stylesheet" href="clientes.css" />
    <link rel="stylesheet" href="../core/modulos.css" />
  </head>
  <body>
    <div class="container container-larga">
      <h1>Clientes</h1>
      <p class="subtitle">Lista de clientes cadastrados</p>

      <div class="filtros-layout">
        <aside class="filtros-sidebar">
          <div class="filtros-sidebar-titulo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            Filtros
          </div>
          <div class="filtro-grupo">
            <div class="filtro-grupo-label">Academia</div>
            <div id="filtroAcademias"><div class="empty-state" style="padding:8px 0; font-size:0.78rem;">Carregando...</div></div>
          </div>
          <div class="filtro-grupo">
            <div class="filtro-grupo-label">Faixa</div>
            <div id="filtroFaixas"><div class="empty-state" style="padding:8px 0; font-size:0.78rem;">Carregando...</div></div>
          </div>
          <button type="button" id="btnLimparFiltrosCliente" class="btn-limpar-filtros">Limpar filtros</button>
        </aside>

        <div class="filtros-resultado">
          <div class="table-section">
            <div class="table-top-bar">
              <input type="text" id="buscaCliente" class="busca-input" placeholder="Buscar por nome, CPF/CNPJ, telefone..." />
              <button type="button" id="btnLixeiraClientes" class="btn btn-small" title="Ver clientes excluídos">Lixeira</button>
              <button type="button" id="btnExportarClientesCsv" class="btn btn-small">Exportar CSV</button>
              <span class="total-badge" id="totalClientes">0 cliente(s)</span>
            </div>
            <div class="table-responsive">
              <table id="tabelaClientes">
                <thead>
                  <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>CPF / CNPJ</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="corpoClientes"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div id="mensagem" class="mensagem"></div>
    </div>

    <div id="movimentacoesModal" class="modal-backdrop" style="display:none;">
      <div class="modal">
        <div class="modal-header">
          <h3>Movimentações de <strong id="modalClienteNome"></strong></h3>
          <button type="button" id="modalClose" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div id="modalMovimentacoes"></div>
        </div>
      </div>
    </div>

    <script src="../core/banco.js"></script>
    <script src="../core/navbar.js"></script>
    <script src="./lista-clientes.js"></script>
  </body>
</html>
