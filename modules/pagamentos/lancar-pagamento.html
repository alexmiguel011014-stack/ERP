<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../core/head.js"></script>
    <script src="../core/auth.js"></script>
    <link rel="stylesheet" href="../core/modulos.css" />
    <title>ALLU ERP - Lançar Pagamento</title>
  </head>
  <body>
    <div class="page">
      <h2>Lançar Novo Pagamento</h2>

      <form id="formPagamento">
        <div class="campo">
          <label>Venda</label>
          <select id="vendaSelect" required disabled>
            <option value="">Carregando vendas...</option>
          </select>
        </div>

        <div class="campo">
          <label>Cliente</label>
          <select id="clienteSelect" disabled>
            <option value="">Selecione uma venda primeiro</option>
          </select>
        </div>

        <div class="campo">
          <label>Método</label>
          <select id="metodoSelect" required>
            <option value="pix">Pix</option>
            <option value="boleto">Boleto</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="cartão">Cartão</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="campo">
          <label>Número/Identificador</label>
          <input type="text" id="numeroIdentificador" placeholder="TXID Pix ou Nº do Boleto" required />
        </div>

        <div class="campo" id="campoQrPix" style="display: none;">
          <button type="button" class="btn-secondary" id="btnGerarQrPix">Gerar QR Code Pix</button>
          <div id="resultadoQrPix" style="margin-top: 0.75rem; display: none;">
            <img id="imgQrPix" alt="QR Code Pix" style="width: 180px; height: 180px; display: block; margin-bottom: 0.5rem;" />
            <textarea id="copiaEColaPix" readonly rows="3" style="width: 100%; font-size: 0.75rem; box-sizing: border-box;"></textarea>
            <button type="button" class="btn-secondary" id="btnCopiarPix" style="margin-top: 0.5rem;">Copiar código</button>
            <p id="statusPix" class="subtitle" style="margin-top: 0.5rem;"></p>
          </div>
        </div>

        <div class="campo">
          <label>Data Recebimento</label>
          <input type="date" id="dataRecebimento" required />
        </div>

        <div class="campo">
          <label>Valor Recebido</label>
          <input type="number" id="valorRecebido" step="0.01" min="0.01" required />
        </div>

        <div class="campo">
          <label>Observação</label>
          <textarea id="observacao" rows="3" placeholder="Observações sobre o recebimento"></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Gravar Pagamento</button>
        </div>
      </form>
    </div>

    <style>
      .campo { margin-bottom: 1rem; }
      .campo label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
      .campo select, .campo input, .campo textarea { width: 100%; padding: 0.5rem; border: 1px solid #CBD5E1; border-radius: 4px; box-sizing: border-box; background: #FFFFFF; color: #1E293B; }
      .campo textarea { min-height: 60px; }
      .btn-primary { background: var(--cor-primaria); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
      .btn-primary:hover { background: var(--cor-primaria-forte); }
      .btn-secondary { background: #6B7280; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
      .btn-secondary:hover { background: #4B5563; }

      /* Mesma lacuna de tema escuro do pagamentos.html — .page/.campo nunca
         tiveram cobertura de dark mode. */
      .dark-theme .campo select,
      .dark-theme .campo input,
      .dark-theme .campo textarea { background: #0F172A; border-color: #334159; color: #F1F5F9; }
    </style>

    <script src="../core/banco.js"></script>
    <script src="../core/navbar.js"></script>
    <script src="../core/formatos.js"></script>
    <script>
      // Elementos do DOM
      const vendaSelect = document.getElementById("vendaSelect");
      const clienteSelect = document.getElementById("clienteSelect");
      const metodoSelect = document.getElementById("metodoSelect");
      const numeroIdentificador = document.getElementById("numeroIdentificador");
      const dataRecebimento = document.getElementById("dataRecebimento");
      const valorRecebido = document.getElementById("valorRecebido");
      const observacao = document.getElementById("observacao");
      const formPagamento = document.getElementById("formPagamento");
      const campoQrPix = document.getElementById("campoQrPix");
      const btnGerarQrPix = document.getElementById("btnGerarQrPix");
      const resultadoQrPix = document.getElementById("resultadoQrPix");
      const imgQrPix = document.getElementById("imgQrPix");
      const copiaEColaPix = document.getElementById("copiaEColaPix");
      const btnCopiarPix = document.getElementById("btnCopiarPix");
      const statusPix = document.getElementById("statusPix");

      // Mostra o botão de gerar QR Code só quando o método é Pix.
      metodoSelect.addEventListener("change", () => {
        campoQrPix.style.display = metodoSelect.value === "pix" ? "block" : "none";
        resultadoQrPix.style.display = "none";
      });

      btnGerarQrPix.addEventListener("click", async () => {
        const valor = parseFloat(valorRecebido.value);
        if (!valor || valor <= 0) {
          alert("Informe o valor antes de gerar o QR Code.");
          return;
        }
        btnGerarQrPix.disabled = true;
        btnGerarQrPix.textContent = "Gerando...";
        try {
          const resultado = await window.erpBanco.pagamentos.gerarQrCodePix({
            valor,
            txid: numeroIdentificador.value.trim() || undefined,
            descricao: vendaSelect.value ? "Venda " + vendaSelect.value : undefined,
          });
          imgQrPix.src = resultado.qrCodeDataUrl;
          copiaEColaPix.value = resultado.copiaECola;
          if (!numeroIdentificador.value.trim() && resultado.txid) {
            numeroIdentificador.value = resultado.txid;
          }
          statusPix.textContent = resultado.automatico
            ? "Confirmação automática habilitada — o pagamento será detectado sozinho."
            : "Confirmação manual: marque como recebido depois que o cliente pagar.";
          resultadoQrPix.style.display = "block";
        } catch (erro) {
          alert("Erro ao gerar QR Code Pix: " + (erro && erro.message ? erro.message : erro));
        } finally {
          btnGerarQrPix.disabled = false;
          btnGerarQrPix.textContent = "Gerar QR Code Pix";
        }
      });

      btnCopiarPix.addEventListener("click", () => {
        copiaEColaPix.select();
        navigator.clipboard.writeText(copiaEColaPix.value).then(() => {
          statusPix.textContent = "Código copiado!";
        }).catch(() => {
          /* clipboard indisponível: o texto já está selecionado pra Ctrl+C manual */
        });
      });

      // Popular vendas do banco (apenas admin)
      async function popularVendas() {
        try {
          const vendas = await window.api.getVendas();
          vendaSelect.innerHTML = "";
          clienteSelect.innerHTML = "<option value=''>-- Selecione uma venda --</option>";

          vendas.forEach((v) => {
            const optV = document.createElement("option");
            optV.value = v.id;
            const totalFormatado = v.total ? formatarMoeda(v.total) : "—";
            optV.textContent = `Venda ${v.id} (Cliente ${v.cliente_nome || "—"} - ${totalFormatado})`;
            vendaSelect.appendChild(optV);
          });
          vendaSelect.disabled = false;
        } catch (erro) {
          console.error("Erro ao popular vendas:", erro);
          vendaSelect.innerHTML = "<option value=''>Erro ao carregar vendas</option>";
        }
      }

      // Ao selecionar uma venda, tentar inferir o cliente (usando dado da venda)
      vendaSelect.addEventListener("change", async (e) => {
        const vendaId = parseInt(e.target.value);
        if (!vendaId) {
          clienteSelect.disabled = true;
          clienteSelect.innerHTML = "<option value=''>Selecione uma venda primeiro</option>";
          return;
        }
        // Aqui poderíamos buscar o cliente da venda via API, mas para simplificar:
        // Vamos apenas habilitar o campo e permitir edição manual.
        clienteSelect.disabled = false;
        clienteSelect.innerHTML = "<option value=''>Inferir do cadastro do cliente</option>";
      });

      // Submit do formulário
      formPagamento.addEventListener("submit", async (e) => {
        e.preventDefault();

        const dados = {
          venda_id: parseInt(vendaSelect.value),
          cliente_id: null, // pode ser preenchido depois ou deixar nulo
          metodo: metodoSelect.value,
          numero_identificador: numeroIdentificador.value.trim(),
          data_recebimento: dataRecebimento.value,
          valor_recebido: parseFloat(valorRecebido.value),
          status: "pendente",
          observacao: observacao.value.trim(),
        };

        if (!dados.venda_id) {
          alert("Selecione uma venda primeiro.");
          return;
        }
        if (!dados.numero_identificador) {
          alert("Informe o identificador (TXID Pix ou número do boleto).");
          return;
        }
        if (!dados.valor_recebido || dados.valor_recebido <= 0) {
          alert("Informe um valor válido maior que zero.");
          return;
        }

        try {
          await window.api.registrarPagamento(dados);
          alert("Pagamento registrado com sucesso!");
          window.location.href = "pagamentos.html";
        } catch (erro) {
          alert("Erro ao registrar pagamento: " + (erro && erro.message ? erro.message : erro));
        }
      });

      // Cancelar: volta pra lista de recebimentos.
      window.fecharModal = function() {
        window.location.href = "pagamentos.html";
      };

      // Inicialização
      campoQrPix.style.display = metodoSelect.value === "pix" ? "block" : "none";
      popularVendas();
    </script>
  </body>
</html>
