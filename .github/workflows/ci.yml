name: CI

on:
  push:
  pull_request:

# windows-latest, não ubuntu: @journeyapps/sqlcipher é um módulo nativo e o
# app só é distribuído pra Windows (NSIS) — evita todo o problema de
# compilar/rebuildar o binário nativo pra uma plataforma que o projeto nem
# suporta.
jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ERP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ERP/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Smoke test (login + visita todas as páginas, coleta erros de console)
        run: npx electron scripts/test-ui.js

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ERP/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ERP/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next-env.d.ts é gerado automaticamente pelo Next.js (next dev/build) e é
      # gitignorado — como este job nunca builda, sem isso o tsc não enxerga os
      # tipos do Next e o typecheck falha com erros de IntrinsicAttributes em
      # qualquer arquivo .tsx, mesmo sem relação com a mudança do PR.
      - name: Generate next-env.d.ts
        shell: bash
        run: |
          cat > next-env.d.ts << 'EOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />

          // NOTE: This file should not be edited
          // see https://nextjs.org/docs/app/api-reference/config/typescript for more information.
          EOF

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Lança o Electron de verdade (via Playwright _electron, ver ERP/e2e/README.md)
  # — por isso precisa do frontend/out buildado primeiro, e não roda no mesmo
  # job que só faz lint+typecheck acima.
  e2e:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ERP/package-lock.json

      - name: Install dependencies (backend)
        working-directory: ERP
        run: npm ci

      - name: Install dependencies (frontend)
        working-directory: ERP/frontend
        run: npm ci

      - name: Build frontend
        working-directory: ERP/frontend
        run: npm run build

      - name: E2E
        working-directory: ERP
        run: npm run test:e2e
