name: CI

on:
  push:
  pull_request:

# windows-latest, não ubuntu: @journeyapps/sqlcipher é um módulo nativo e o
# app só é distribuído pra Windows (NSIS) — evita todo o problema de
# compilar/rebuildar o binário nativo pra uma plataforma que o projeto nem
# suporta.
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Smoke test (login + visita todas as páginas, coleta erros de console)
        run: npx electron scripts/test-ui.js

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next-env.d.ts é gerado automaticamente pelo Next.js na primeira vez
      # que `next dev`/`next build` roda, e fica no .gitignore — este job
      # nunca builda (só lint+typecheck, o build de verdade é do job e2e),
      # então sem isso o arquivo nunca existe aqui. Sem ele, `tsc --noEmit`
      # perde a referência ambiente que o Next injeta e ~30 erros reais de
      # `IntrinsicAttributes`/className aparecem em componentes que não têm
      # nada a ver com a mudança sendo testada (reproduzido localmente:
      # apagar o next-env.d.ts local reproduz os mesmos erros, nas mesmas
      # linhas, de qualquer PR).
      - name: Generate next-env.d.ts (needed for typecheck; normally created by next dev/build)
        run: |
          Set-Content -Path next-env.d.ts -Value '/// <reference types="next" />'
          Add-Content -Path next-env.d.ts -Value '/// <reference types="next/image-types/global" />'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Lança o Electron de verdade (via Playwright _electron, ver e2e/README.md)
  # — por isso precisa do frontend/out buildado primeiro, e não roda no mesmo
  # job que só faz lint+typecheck acima.
  e2e:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (backend)
        run: npm ci

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: E2E
        run: npm run test:e2e
